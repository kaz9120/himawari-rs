# ADR-0245 のA12。1つのFTにk×(p＋e)、純粋な習甦形式（構成 1024x16x32e1024p-kp_ke）。
# 主のHalfKPを0で凍結し、側の幅1024のaccumulatorに入れる。1億局面で学習し、
# 原点のeff_ctrlと1手30万ノード固定で1,000ペア指す。対局は11時間前後の見込み。
adr = "0245"

[[step]]
id = "select-dedup"
run = "hmwr data dedup sel_dedup_100M --in train_7860M_q1 --count 100000000"

[[step]]
id = "train"
run = "hmwr net train adr0245_a12 --arch 1024x16x32e1024p-kp_ke --data sel_dedup_100M --valid valid_tanuki_dl430_q1 --rank rank_tanuki_210M --seed 0 --extra=\"--halfkp-inputs none\" --notes \"ADR-0245 A12 1つのFTにk×(p＋e)、純粋な習甦形式\""

[[step]]
id = "build"
run = "hmwr build shapes 1024x16x32e64 1024x16x32e1024p-kp_ke --tag adr0245"

[[step]]
id = "match-q"
run = "hmwr match run adr0245-a12-q --base-build shape-1024x16x32e64 --cand-build shape-1024x16x32e1024p-kp_ke --base-net eff_ctrl --cand-net adr0245_a12 --nodes 300000 --stop pairs:1000 --max-moves 400 --foreground"
