# ADR-0261 の本番の学習。主256＋F2＋最小の攻め駒（構成 256x16x32e64-f2_minatt）を、
# ADR-0249 の A14 と同じ母集団・同じレシピ（2周）で学習する。
# 続けて、現行を原点にA14とE1の質を1手30万ノード固定・1,000ペアで測る。
# 並べ替えとSPRTは対話セッションで行う（running-sprt スキル）。
adr = "0261"

[[step]]
id = "train"
run = "hmwr net train pool1_2ep_minatt256 --arch 256x16x32e64-f2_minatt --data pool1 --valid valid_tanuki_dl430_q1 --rank rank_tanuki_210M --seed 0 --extra=\"--epochs 2\" --notes \"ADR-0261 本番の学習、主256、F2と最小の攻め駒\""

[[step]]
id = "build"
run = "hmwr build shapes 1024x16x32e64 1024x16x32e64-f2_minatt 256x16x32e64-f2_minatt --tag adr0261"

[[step]]
id = "match-q-a14"
run = "hmwr match run adr0261-q-a14 --base-build shape-1024x16x32e64 --cand-build shape-1024x16x32e64-f2_minatt --base-net pool1_2ep_f2_reorder --cand-net pool1_2ep_minatt_reorder --nodes 300000 --stop pairs:1000 --max-moves 400 --foreground"

[[step]]
id = "match-q-e1"
run = "hmwr match run adr0261-q-e1 --base-build shape-1024x16x32e64 --cand-build shape-256x16x32e64-f2_minatt --base-net pool1_2ep_f2_reorder --cand-net data/nets/pool1_2ep_minatt256.hmwr.best --nodes 300000 --stop pairs:1000 --max-moves 400 --foreground"
