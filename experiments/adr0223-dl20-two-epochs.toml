# ADR-0223: dlshogiラベルの20億を2周し、1周のネット（dl20_7860M）とSPRTで比べる。
# 学習は約25時間。落ちたら同じコマンドでエポック内の位置から続く。
adr = "0223"

[[step]]
id = "train-2ep"
run = "hmwr net train dl20_2ep --data train_7860M_q1 --valid valid_tanuki_dl430_q1 --rank rank_tanuki_210M --seed 0 --positions 2000000000 --extra=\"--epochs 2\" --notes \"ADR-0223 dlshogiラベルの先頭20億を2周、ゼロから\""

[[step]]
id = "sprt-2ep"
run = "hmwr sprt net data/nets/dl20_7860M.hmwr data/nets/dl20_2ep.hmwr adr0223-dl20-2ep --foreground"
