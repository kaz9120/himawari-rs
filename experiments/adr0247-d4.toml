# ADR-0247 のD4。主128、利きなし（構成 128x16x32）。
# 1億局面で学習し、原点のeff_ctrl（ADR-0237の統制）と1手30万ノード固定で1,000ペア指す。
# 学習データは同じ条件なら作り直さないので、どのspecからでも始められる。
adr = "0247"

[[step]]
id = "select-dedup"
run = "hmwr data dedup sel_dedup_100M --in train_7860M_q1 --count 100000000"

[[step]]
id = "train"
run = "hmwr net train adr0247_d4 --arch 128x16x32 --data sel_dedup_100M --valid valid_tanuki_dl430_q1 --rank rank_tanuki_210M --seed 0 --notes \"ADR-0247 D4 主128、利きなし\""

[[step]]
id = "build"
run = "hmwr build shapes 1024x16x32e64 128x16x32 --tag adr0247"

[[step]]
id = "match-q"
run = "hmwr match run adr0247-d4-q --base-build shape-1024x16x32e64 --cand-build shape-128x16x32 --base-net eff_ctrl --cand-net adr0247_d4 --nodes 300000 --stop pairs:1000 --max-moves 400 --foreground"
