# ADR-0248 のE1。主256、F2＋最小の攻め駒（構成 256x16x32e64-f2_minatt）。
# 1億局面で学習し、原点のeff_ctrl（ADR-0237の統制）と1手30万ノード固定で1,000ペア指す。
# 最小の攻め駒の上乗せは、同じ幅のF2だけの構成（ADR-0247のD1）との差で読む。
adr = "0248"

[[step]]
id = "select-dedup"
run = "hmwr data dedup sel_dedup_100M --in train_7860M_q1 --count 100000000"

[[step]]
id = "train"
run = "hmwr net train adr0248_e1 --arch 256x16x32e64-f2_minatt --data sel_dedup_100M --valid valid_tanuki_dl430_q1 --rank rank_tanuki_210M --seed 0 --notes \"ADR-0248 E1 主256、F2と最小の攻め駒\""

[[step]]
id = "build"
run = "hmwr build shapes 1024x16x32e64 256x16x32e64-f2_minatt --tag adr0248"

[[step]]
id = "match-q"
run = "hmwr match run adr0248-e1-q --base-build shape-1024x16x32e64 --cand-build shape-256x16x32e64-f2_minatt --base-net eff_ctrl --cand-net adr0248_e1 --nodes 300000 --stop pairs:1000 --max-moves 400 --foreground"
