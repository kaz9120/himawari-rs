[package]
name = "himawari-engine"
description = "探索・置換表・評価・時間管理"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
himawari-core = { path = "../core" }

# 第1層へ入る活性の非ゼロパターンをダンプする（ADR-0168の調査用）。
# 通常のビルドには入らない。
[features]
actdump = []
# SPSAの対象定数をatomicにしてUSIオプションへ出す（ADR-0143）。
# 通常のビルドには入らない。
tune = []
# 入力をHalfKAへ拡張する（ADR-0193）。coreの同名featureへ転送する。
halfka = ["himawari-core/halfka"]

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "nnue_dot"
harness = false

[[bench]]
name = "mate1ply"
harness = false
