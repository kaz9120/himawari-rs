[package]
name = "himawari-engine"
description = "探索・置換表・評価・時間管理"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
himawari-core = { path = "../core" }
# 配列盤の研究（ADR-0241の段階6、研究ブランチだけ）。フィーチャ mailbox で入る
himawari-mailbox = { path = "../mailbox", optional = true }

# 第1層へ入る活性の非ゼロパターンをダンプする（ADR-0168の調査用）。
# 通常のビルドには入らない。
[features]
actdump = []
# SPSAの対象定数をatomicにしてUSIオプションへ出す（ADR-0143）。
# 通常のビルドには入らない。
tune = []
# 探索の盤の問い合わせを配列盤へ回す（ADR-0241の段階6、研究ブランチだけ）。
# 既定はcoreのまま。cargo build -p himawari-usi --features himawari-engine/mailbox で作る
mailbox = ["dep:himawari-mailbox"]
# coreの盤のまま、擬似合法手の生成を合法手で濾す統制群（ADR-0241の第12回）。
# 配列盤の生成が合法手だけを出すことで木が変わる分を、配列盤なしで再現する
legal-gen = []

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "nnue_dot"
harness = false

[[bench]]
name = "mate1ply"
harness = false
