[package]
name = "himawari-mailbox"
description = "配列盤と利きの配列による盤面表現。探索の盤の既定"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# 戻しを差分ではなく、利きの表の複写で行う。既定の戻し方と比べるための構成
copy-undo = []
# 盤と利きの表の1列を16升にする。外すと1列11升（143要素）になる。
# 1列11升と比べた計測で、16升がratio_moveを約0.1下げたので既定にした
default = ["stride16"]
stride16 = []

# 既存のcoreは正しさの照合（perft・生成の列）とcoreとの速さの比較にだけ使う。本体は依存しない。
# himawari-toolsは計測の局面リストの読み込みに使う（boardbenchと同じ局面）
[dev-dependencies]
himawari-core = { path = "../core" }
himawari-tools = { path = "../tools" }
# 1手詰めの照合にcoreの探索側の mate_1ply を使う
himawari-engine = { path = "../engine" }

# 盤面操作のミクロな計測。cargo bench -p himawari-mailbox --bench mbbench
[[bench]]
name = "mbbench"
harness = false
