[package]
name = "himawari-usi"
description = "USIプロトコル層とエンジン本体のバイナリ"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "himawari"
path = "src/main.rs"

[features]
# FTの出力次元を512にする（ADR-0067）
ft512 = ["himawari-engine/ft512"]

[dependencies]
himawari-core = { path = "../core" }
himawari-engine = { path = "../engine" }

[lints]
workspace = true
