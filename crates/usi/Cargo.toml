[package]
name = "himawari-usi"
description = "USIプロトコル層とエンジン本体のバイナリ"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "himawari"
path = "src/main.rs"

[dependencies]
himawari-core = { path = "../core" }
himawari-engine = { path = "../engine" }

# SPSAのチューニング用ビルド（ADR-0143）。対象定数をUSIオプションへ出す。
[features]
tune = ["himawari-engine/tune"]
# 配列盤の答えをcoreと照合する構成（ADR-0241）
mailbox-shadow = ["himawari-engine/mailbox-shadow"]

[lints]
workspace = true
