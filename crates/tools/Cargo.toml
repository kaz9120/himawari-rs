[package]
name = "himawari-tools"
description = "開発用ツール群（perft等）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "perft"
path = "src/bin/perft.rs"

[dependencies]
himawari-core = { path = "../core" }
himawari-engine = { path = "../engine" }
# 開発用ツールだけの依存。配布する himawari バイナリ（core・engine・usi）は
# 依存ゼロを保つ（ADR-0122）
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[features]
# 入力をHalfKAへ拡張する（ADR-0193）。makenet・psvの次元が変わる。
halfka = ["himawari-engine/halfka", "himawari-core/halfka"]

[lints]
workspace = true

[[bin]]
name = "tsume"
path = "src/bin/tsume.rs"

[[bin]]
name = "selfplay"
path = "src/bin/selfplay/main.rs"

[[bin]]
name = "makenet"
path = "src/bin/makenet.rs"

[[bin]]
name = "psv"
path = "src/bin/psv.rs"

[[bin]]
name = "book"
path = "src/bin/book.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[[bin]]
name = "profile"
path = "src/bin/profile.rs"

[[bin]]
name = "league"
path = "src/bin/league.rs"

[[bin]]
name = "blindspot"
path = "src/bin/blindspot.rs"
