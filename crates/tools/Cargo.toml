[package]
name = "himawari-tools"
description = "開発用ツール群（perft等）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "perft"
path = "src/bin/perft.rs"

[features]
# FTの出力次元を512にする（ADR-0067）
ft512 = ["himawari-engine/ft512"]

[dependencies]
himawari-core = { path = "../core" }
himawari-engine = { path = "../engine" }
# 開発用ツールだけの依存。配布する himawari バイナリ（core・engine・usi）は
# 依存ゼロを保つ（ADR-0122）
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true

[[bin]]
name = "tsume"
path = "src/bin/tsume.rs"

[[bin]]
name = "selfplay"
path = "src/bin/selfplay/main.rs"

[[bin]]
name = "makenet"
path = "src/bin/makenet.rs"

[[bin]]
name = "psv"
path = "src/bin/psv.rs"

[[bin]]
name = "book"
path = "src/bin/book.rs"

[[bin]]
name = "train"
path = "src/bin/train/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[[bin]]
name = "profile"
path = "src/bin/profile.rs"
