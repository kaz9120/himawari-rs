[package]
name = "himawari-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "himawari"
crate-type = ["cdylib"]

[features]
# FTの出力次元を512にする（ADR-0067）
ft512 = ["himawari-engine/ft512"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
numpy = "0.24"
rayon = "1"
himawari-core = { path = "../core" }
himawari-engine = { path = "../engine" }
