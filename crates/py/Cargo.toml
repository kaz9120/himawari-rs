[package]
name = "himawari-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "himawari"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
numpy = "0.24"
rayon = "1"
himawari-core = { path = "../core" }
himawari-engine = { path = "../engine" }

[features]
# 入力をHalfKAへ拡張する（ADR-0193）。engine経由でcoreにも効く。
halfka = ["himawari-engine/halfka"]
