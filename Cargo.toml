[workspace]
resolver = "3"
members = ["crates/core", "crates/engine", "crates/tools", "crates/usi", "crates/py"]
default-members = ["crates/core", "crates/engine", "crates/tools", "crates/usi"]

[workspace.package]
version = "0.27.4"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# 探索エンジンは単一バイナリで動かすため、リリースは最適化を最大にする（ADR-0003）
[profile.release]
lto = true
codegen-units = 1
