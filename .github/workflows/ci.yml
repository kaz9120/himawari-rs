name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      # perft既知値の照合（debugではignoreされる。ADR-0006/0018）
      - run: cargo test --workspace --release
      # 既定以外のネットワーク構成（ADR-0127）。L1をパディングする経路と
      # FTを太らせた経路が壊れていないことを、コンパイルとテストで確認する
      - run: HIMAWARI_ARCH=512x16x64 cargo test --workspace
      # やねうら王形式（nn.bin）の読み込みは256x32x32でだけ有効になる
      # （ADR-0067）。既定構成から外れたので、明示して回さないと
      # 互換のテストが1つも走らない（ADR-0170）
      - run: HIMAWARI_ARCH=256x32x32 cargo test -p himawari-engine --lib
      # 活性ダンプのfeature（ADR-0168）。通常のビルドでは触らないので、
      # コンパイルが通ることだけ確かめて腐るのを防ぐ
      - run: cargo check -p himawari-engine --features actdump
      # SPSAチューニングのfeature（ADR-0143）。setoptionの動作は
      # engine側の単体テストで確かめる
      - run: cargo test -p himawari-usi --features tune
      - run: cargo test -p himawari-engine --features tune --lib
      # hmwrコマンドと解析ツールのPython（ADR-0180）。引数処理は同じ入力から
      # 同じコマンド列が出ることを、解析はログの読み取りを固定する
      - run: pip install --quiet pytest
      - run: python3 -m pytest tests -q

  # 日本語文書のlint（ADR-0178）。CLAUDE.mdの書き方の規約のうち、
  # 機械が判定できるものをここで見る
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # NNUE推論のAVX2経路を検証する（ADR-0099）。既定のx86-64ターゲットは
  # SSE2までで、上のジョブではAVX2経路がコンパイルされない
  avx2:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-feature=+avx2
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p himawari-engine --release
