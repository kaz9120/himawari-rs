name: CI

# checkは直列だと7〜10分かかる（#408）。実行するコマンドと合否基準は
# 変えずにジョブへ分割し、並列に走らせて壁時間を縮める。ブランチ保護と
# release-pleaseのauto-mergeが見るrequired checkはジョブ名checkなので、
# checkは分割したジョブの結果を集約する役だけを持つ。
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# 検査だけなので、GITHUB_TOKENは読み取りに絞る
permissions:
  contents: read

# 同じPRへ連続pushしたとき、古いコミットのrunを打ち切る。
# mainへのpushは打ち切らない（release-pleaseがcheckの通過を待つ）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # 探索の盤の既定は配列盤（ADR-0241）。比較と照合のために残すcoreの探索も腐らせない
      - run: cargo clippy --all-targets --features himawari-engine/core-search -- -D warnings
      # 活性ダンプのfeature（ADR-0168）。通常のビルドでは触らないので、
      # コンパイルが通ることだけ確かめて腐るのを防ぐ
      - run: cargo check -p himawari-engine --features actdump
      # hmwrコマンドと解析ツールのPython（ADR-0180）。引数処理は同じ入力から
      # 同じコマンド列が出ることを、解析はログの読み取りを固定する
      - run: pip install --quiet pytest numpy
      - run: python3 -m pytest tests -q

  # PythonのlintをRustのlintと分けて回す（#758）。ruffの既定の規則だけを見る。
  # Pythonとruffの版は開発機に揃えて固定する
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"
      - run: pip install --quiet ruff==0.8.0
      - run: ruff check .

  # debugビルドのテストはopt-level=1で回す（#664）。opt-level=0では
  # engineのlibテストとsearch_testsの実行だけで2分前後かかり、CIの
  # クリティカルパスになっていた。debug_assertionsとoverflow-checksは
  # opt-levelと独立に有効のままなので、debugでしか見つからない不具合を
  # 守る役目は変わらない
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace

  # perft既知値の照合（debugではignoreされる。ADR-0006/0018）
  # LTOを外し、codegen-unitsを16にする（#806）。時間の大半はテストの実行
  # ではなく、テストのバイナリごとにかかるLTOのリンクだった。守るものは
  # releaseの意味論で、opt-level=3・debug_assertionsなし・overflowの
  # 折り返しは変わらない。LTOでのビルドは下のavx2ジョブがengineで続ける。
  # 配布物はPGOも掛かるので、どちらのジョブとも元から同一ではない
  test-release:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: false
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --release

  # 構成ごとに別ジョブで並べる。直列だとCI全体でいちばん長いジョブになっていた
  test-arch:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 既定以外のネットワーク構成（ADR-0127）。L1をパディングする経路と
          # FTを太らせた経路が壊れていないことを、コンパイルとテストで確認する
          - arch: 512x16x64
            args: --workspace
          # 利きのaccumulatorを持たない構成（ADR-0237より前の既定）。既定が
          # e64になったので、利きの経路をコードごと消すビルドをここで守る
          - arch: 1024x16x32
            args: --workspace
          # F2と最小の攻め駒を升の語の差分で持つ構成（ADR-0248）。差分の累積が
          # side_featの作り直しと一致することを、engineの単体テストで守る
          - arch: 1024x16x32e64-f2_minatt
            args: -p himawari-engine --lib
    runs-on: ubuntu-latest
    # testジョブと同じ理由でopt-level=1にする
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # 構成ごとにビルド結果が違うので、キャッシュを分ける
          key: ${{ matrix.arch }}
      - run: HIMAWARI_ARCH=${{ matrix.arch }} cargo test ${{ matrix.args }}

  # 探索の盤の構成（ADR-0241）。既定の配列盤は上のtestジョブが見る。ここでは
  # 比較と照合のために残すcoreの探索と、配列盤とcoreを並べて毎回答えを比べる
  # 構成（debugビルドで比べる）のテストを回す
  test-board:
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: --workspace --features himawari-engine/core-search
          - args: -p himawari-engine --features mailbox-shadow
    runs-on: ubuntu-latest
    # testジョブと同じ理由でopt-level=1にする
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.args }}
      - run: cargo test ${{ matrix.args }}

  # SPSAチューニングのfeature（ADR-0143）。setoptionの動作は
  # engine側の単体テストで確かめる
  test-tune:
    runs-on: ubuntu-latest
    # testジョブと同じ理由でopt-level=1にする
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p himawari-usi --features tune
      - run: cargo test -p himawari-engine --features tune --lib

  # required checkの集約。ほかの全ジョブが成功したときだけ成功する。
  # 下のdocsとavx2も含める。外していた間、文書のlintが落ちたリリースPRが
  # 自動マージされた（#751）。ジョブを足したらここへも足す
  check:
    needs: [lint, ruff, test, test-release, test-arch, test-board, test-tune, docs, avx2]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = "success" ] || exit 1
          done

  # 日本語文書のlint（ADR-0244）。同梱したyomiyasuで、AIの文に出やすい
  # 書き方を見る。標準ライブラリだけで動くので、ランナーのPythonで回す
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./bin/hmwr doc lint


  # NNUE推論のAVX2経路を検証する（ADR-0099）。既定のx86-64ターゲットは
  # SSE2までで、上のジョブではAVX2経路がコンパイルされない。
  # Cargo.tomlのLTOのままで回す。LTOでビルドしたengineのテストはここで残る
  avx2:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-feature=+avx2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p himawari-engine --release
