name: Release

# タグpushでCPU別バイナリをビルドしてGitHub Releaseに添付する
# （ADR-0003のtarget-feature固定ビルド、ADR-0007のビルド識別子）。
# Release作成の競合を避けるため、ビルドはartifact経由で単一ジョブに集約する。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64-avx2
            rustflags: "-C target-cpu=x86-64-v3"
            bin: himawari
          - os: ubuntu-latest
            name: linux-x64-sse42
            rustflags: "-C target-cpu=x86-64-v2"
            bin: himawari
          - os: windows-latest
            name: windows-x64-avx2
            rustflags: "-C target-cpu=x86-64-v3"
            bin: himawari.exe
          - os: windows-latest
            name: windows-x64-sse42
            rustflags: "-C target-cpu=x86-64-v2"
            bin: himawari.exe
          - os: macos-14
            name: macos-arm64
            rustflags: ""
            bin: himawari
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          export RUSTFLAGS="${{ matrix.rustflags }}"
          export HIMAWARI_BUILD_ID="${GITHUB_SHA::7}"
          cargo build --release -p himawari-usi
      - name: Package
        shell: bash
        run: |
          cp "target/release/${{ matrix.bin }}" .
          python3 -m zipfile -c "himawari-${{ github.ref_name }}-${{ matrix.name }}.zip" "${{ matrix.bin }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: himawari-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 前タグからのコミット件名とSPRTトレーラでノートを組む（ADR-0069）
      - name: Generate release notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          RANGE="${PREV:+${PREV}..}${TAG}"
          SPRT=$(git log --pretty=format:"%(trailers:key=SPRT,valueonly)" "$RANGE" | grep -v '^$' || true)
          {
            if [ -n "$SPRT" ]; then
              echo "## 採択したSPRT"
              echo
              echo "$SPRT" | sed 's/^/- /'
              echo
            fi
            echo "## 変更"
            echo
            git log --no-merges --pretty=format:"- %s" "$RANGE"
            echo
            echo
            echo "## 使い方"
            echo
            echo '評価関数は同梱していない（ADR-0069）。USIオプション `EvalFile` に'
            echo '`.hmwr` のパスを指定する。未指定なら駒割評価で動く。'
            if [ -n "$PREV" ]; then
              echo
              echo "前リリース: ${PREV}"
            fi
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: himawari-*.zip
