name: Release

# タグpushでCPU別バイナリをビルドし、release-pleaseが作ったGitHub
# Releaseへ添付する（target-featureを固定したビルド）。
# 添付の競合を避けるため、ビルドはartifact経由で単一ジョブに集約する。
# リリースノートとタグはrelease-pleaseが作るので、ここでは触らない。
#
# 配布バイナリはPGOで作る（+10%前後のNPS）。手順は
# scripts/build-pgo.sh と同じ3段で、各ターゲットのrunner上で計測用
# ビルド→ベンチ4局面の走行→profile-useの再ビルドを行う。学習走行の
# 評価関数はネット配布リリースから取得する。
# workflow_dispatchは、tagを省くとタグなしの動作確認で、Releaseへ添付しない。
# tagを渡すと、そのタグのコードをいまのワークフローでビルドして、そのReleaseへ
# 添付する。ランナーの廃止などで添付に失敗した版を出し直すときに使う。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "添付し直すタグ（例 v0.61.0）。省くと動作確認だけ"
        required: false
        default: ""

# 書き込みはReleaseへ添付するreleaseジョブだけが持つ。buildは
# ネット配布リリースの取得とartifactのアップロードだけなので読み取りで足りる
permissions:
  contents: read

env:
  # 学習走行に使う評価関数。現行ネットを差し替えたら更新する。
  # net-v16からアセットは固定名 eval.hmwr になる
  NET_TAG: net-v17
  NET_ASSET: eval.hmwr
  # 添付先のタグ。タグpushならそのタグ、workflow_dispatchなら入力のタグ
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64-avx2
            rustflags: "-C target-cpu=x86-64-v3"
            bin: himawari
          - os: ubuntu-latest
            name: linux-x64-sse42
            rustflags: "-C target-cpu=x86-64-v2"
            bin: himawari
          # WindowsはMSVCランタイムを静的リンクする。
          # 既定の動的リンクだと VCRUNTIME140.dll が要り、再頒布可能
          # パッケージの入っていない環境で起動しない
          - os: windows-latest
            name: windows-x64-avx2
            rustflags: "-C target-cpu=x86-64-v3 -C target-feature=+crt-static"
            bin: himawari.exe
          - os: windows-latest
            name: windows-x64-sse42
            rustflags: "-C target-cpu=x86-64-v2 -C target-feature=+crt-static"
            bin: himawari.exe
          # macos-14のランナーは廃止された（2026-11、v0.60.2〜v0.61.0の添付が止まった）
          - os: macos-15
            name: macos-arm64
            rustflags: ""
            bin: himawari
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Fetch eval net
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$NET_TAG" --pattern "$NET_ASSET"
      - name: Install llvm-tools
        shell: bash
        run: |
          # rust-toolchain.tomlの固定版を先に入れてからコンポーネントを足す
          cargo --version
          rustup component add llvm-tools \
            --toolchain "$(rustup show active-toolchain | cut -d' ' -f1)"
      - name: Build (instrumented)
        shell: bash
        run: |
          # Windowsのgit-bashでは、環境変数の中のMSYSパスがrustcへ
          # 変換されずに渡る。pwd -W でWindows形式のパスにする
          ROOT="$PWD"
          if [[ "$RUNNER_OS" == "Windows" ]]; then ROOT="$(pwd -W)"; fi
          export RUSTFLAGS="${{ matrix.rustflags }} -C profile-generate=${ROOT}/pgo-raw"
          export HIMAWARI_BUILD_ID="$(git rev-parse --short=7 HEAD)"
          cargo build --release -p himawari-usi
          cargo build --release -p himawari-tools --bin bench
      - name: Train (bench positions)
        shell: bash
        run: |
          BENCH="./target/release/bench"
          if [[ -f "${BENCH}.exe" ]]; then BENCH="${BENCH}.exe"; fi
          "$BENCH" "./target/release/${{ matrix.bin }}" \
            --depth 22 --runs 1 --eval-file "$NET_ASSET"
          PROFDATA="$(find "$(rustc --print sysroot)/lib/rustlib" -name 'llvm-profdata*' -type f | head -1)"
          "$PROFDATA" merge -o merged.profdata pgo-raw/*.profraw
      - name: Build (profile-use)
        shell: bash
        run: |
          ROOT="$PWD"
          if [[ "$RUNNER_OS" == "Windows" ]]; then ROOT="$(pwd -W)"; fi
          export RUSTFLAGS="${{ matrix.rustflags }} -C profile-use=${ROOT}/merged.profdata"
          export HIMAWARI_BUILD_ID="$(git rev-parse --short=7 HEAD)"
          cargo build --release -p himawari-usi
      - name: Package
        shell: bash
        run: |
          cp "target/release/${{ matrix.bin }}" .
          python3 -m zipfile -c "himawari-${TAG}-${{ matrix.name }}.zip" "${{ matrix.bin }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: himawari-*.zip

  release:
    needs: build
    # workflow_dispatchの動作確認（tagなし）ではReleaseへ添付しない
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      # release-pleaseが作ったリリースへ添付する。
      # bodyを渡さないので、生成済みのリリースノートはそのまま残る。
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: himawari-*.zip
