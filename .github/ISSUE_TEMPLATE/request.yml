name: 提案・要望
description: 機能の追加や変更、使い勝手の提案
title: "提案: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        棋力に関わる変更（探索・評価関数・時間管理）は、ADRを起こしてSPRTで測ってから
        取り込みます（[docs/adr](../../docs/adr/README.md)）。提案の段階では設計の
        詳細は要りません。何に困っていて、どうなると良いかを書いてください。
  - type: textarea
    id: what
    attributes:
      label: 何をどうしたいか
      placeholder: 定跡ファイルをやねうら王のdb形式のまま読めるようにしてほしい
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 背景・困っていること
      placeholder: 手持ちの定跡がその形式で、変換の手間がある
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 今の回避策があれば
